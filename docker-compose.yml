version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trading_bot_app
    volumes:
      # Mount the entire project directory for easy development
      - .:/home/appuser/app
    depends_on:
      - postgres
      - redis
      - kafka
    environment:
      - PYTHONUNBUFFERED=1
      # --- Database Configuration ---
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=tradingbot
      - POSTGRES_PASSWORD=supersecretpassword
      - POSTGRES_DB=tradingbotdb
      # --- Cache Configuration ---
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # --- Message Queue Configuration ---
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    # Keep the container running
    command: tail -f /dev/null

  postgres:
    image: postgres:14-alpine
    container_name: trading_bot_postgres
    environment:
      - POSTGRES_USER=tradingbot
      - POSTGRES_PASSWORD=supersecretpassword
      - POSTGRES_DB=tradingbotdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradingbot -d tradingbotdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: trading_bot_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.2
    container_name: trading_bot_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.3.2
    container_name: trading_bot_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

volumes:
  postgres_data:
    driver: local
