# Risk Limits Configuration
position_limits:
  # Per-asset position limits (as fraction of portfolio)
  BTC-USD: 0.3
  ETH-USD: 0.25
  SOL-USD: 0.15
  default: 0.1

exposure_limits:
  # Maximum exposure by category
  crypto_total: 0.8
  defi_tokens: 0.3
  layer1_tokens: 0.6
  
correlation_limits:
  # Maximum correlation between positions
  max_correlation: 0.7
  correlation_window: 30  # days
  
liquidity_requirements:
  # Minimum liquidity requirements
  min_daily_volume: 10000000  # $10M
  min_order_book_depth: 100000  # $100K at 1% spread
  max_market_impact: 0.001  # 0.1%
  
drawdown_controls:
  # Drawdown-based position scaling
  mild_drawdown: 0.05  # Scale down to 80%
  moderate_drawdown: 0.10  # Scale down to 60%
  severe_drawdown: 0.15  # Scale down to 40%
  emergency_drawdown: 0.20  # Stop trading
  
volatility_controls:
  # Volatility-based adjustments
  low_vol_threshold: 0.1
  high_vol_threshold: 0.4
  vol_scaling_factor: 0.5
  
time_based_limits:
  # Time-based risk controls
  max_trades_per_hour: 100
  max_trades_per_day: 1000
  trading_hours:
    start: "00:00"
    end: "23:59"
    timezone: "UTC"